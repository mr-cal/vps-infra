name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'plans/**'
      - '.gitignore'
  workflow_dispatch:
  repository_dispatch:
    types: [pcbisolation-updated, craft-dashboard-updated, egg-calculator-updated, flashcandy-updated, bm-tracker-updated]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REMARK_SECRET: ${{ secrets.REMARK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AKISMET_KEY: ${{ secrets.AKISMET_KEY }}
          REMARK_ADMIN_PASSWD: ${{ secrets.REMARK_ADMIN_PASSWD }}
          REMARK_ADMIN_EMAIL: ${{ secrets.REMARK_ADMIN_EMAIL }}
          REMARK_BACKUP_GPG_PASSPHRASE: ${{ secrets.REMARK_BACKUP_GPG_PASSPHRASE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_PASSWORD,REMARK_SECRET,RESEND_API_KEY,AKISMET_KEY,REMARK_ADMIN_PASSWD,REMARK_ADMIN_EMAIL,REMARK_BACKUP_GPG_PASSPHRASE
          script: |
            set -euo pipefail

            EVENT_NAME="${{ github.event_name }}"
            EVENT_TYPE="${{ github.event.action }}"
            echo "Deploy triggered: event=${EVENT_NAME}, type=${EVENT_TYPE}"

            if ! command -v podman-compose >/dev/null 2>&1; then
              apt install -y podman podman-compose
            fi

            if [ ! -d /opt/vps-infra ]; then
              git clone https://github.com/mr-cal/vps-infra.git /opt/vps-infra
            fi

            cd /opt/vps-infra

            # Function to update submodules cleanly without rebase directory errors
            update_submodule() {
              local sub="$1"
              echo "Updating submodule: $sub"
              find ".git/modules/$sub" -name 'rebase-merge' -type d -exec rm -rf {} + 2>/dev/null || true
              find ".git/modules/$sub" -name 'rebase-apply' -type d -exec rm -rf {} + 2>/dev/null || true
              git submodule update --checkout --remote --init -- "$sub"
            }

            # Helper verification functions
            verify_egg_calculator() {
              echo "Verifying eggcalculator.com..."
              local status
              status=$(curl -4 -s -o /dev/null -w "%{http_code}" --max-time 10 \
                --resolve eggcalculator.com:443:127.0.0.1 \
                https://eggcalculator.com/ 2>/dev/null || true)
              echo "eggcalculator.com status: $status"
              [ "$status" = "200" ] || { echo "ERROR: eggcalculator.com did not come up (status: $status)"; exit 1; }
            }

            verify_pcbisolation() {
              echo "Verifying pcbisolation.com..."
              local status
              status=$(curl -4 -s -o /dev/null -w "%{http_code}" --max-time 10 \
                --resolve pcbisolation.com:80:127.0.0.1 \
                http://pcbisolation.com/ 2>/dev/null || true)
              echo "pcbisolation.com status: $status"
              [[ "$status" = "200" || "$status" = "301" || "$status" = "308" ]] || \
                { echo "ERROR: pcbisolation.com did not come up (status: $status)"; exit 1; }
            }

            verify_flashcandy() {
              echo "Verifying flashcandy.us..."
              local status
              status=$(curl -4 -s -o /dev/null -w "%{http_code}" --max-time 10 \
                --resolve flashcandy.us:80:127.0.0.1 \
                http://flashcandy.us/ 2>/dev/null || true)
              echo "flashcandy.us status: $status"
              [[ "$status" = "200" || "$status" = "301" || "$status" = "308" ]] || \
                { echo "ERROR: flashcandy.us did not come up (status: $status)"; exit 1; }
            }

            verify_bm_tracker() {
              echo "Waiting for bm-tracker to come up (IPv4)..."
              local bm_status=""
              for i in $(seq 1 12); do
                bm_status=$(curl -4 -sL -o /dev/null -w "%{http_code}" --max-time 10 \
                  --resolve 3142468.xyz:443:127.0.0.1 \
                  --resolve 3142468.xyz:80:127.0.0.1 \
                  https://3142468.xyz/ 2>/dev/null || true)
                echo "  attempt $i: $bm_status"
                [ "$bm_status" = "200" ] && break
                sleep 5
              done
              [ "$bm_status" = "200" ] || { echo "ERROR: bm-tracker did not come up (last status: $bm_status)"; exit 1; }
              echo "bm-tracker is up."
            }

            verify_craft_dashboard() {
              echo "Waiting for craft-dashboard to come up (IPv4)..."
              local status=""
              for i in $(seq 1 12); do
                status=$(curl -4 -s -o /dev/null -w "%{http_code}" --max-time 10 \
                  --resolve craft-dashboard.name:443:127.0.0.1 \
                  --resolve craft-dashboard.name:80:127.0.0.1 \
                  https://craft-dashboard.name/ 2>/dev/null || true)
                echo "  attempt $i: $status"
                [ "$status" = "200" ] && break
                sleep 5
              done
              [ "$status" = "200" ] || { echo "ERROR: craft-dashboard did not come up on IPv4 (last status: $status)"; exit 1; }
              echo "craft-dashboard is up on IPv4."

              local ipv6_addr
              ipv6_addr=$(ip -6 addr show eth0 scope global | awk '/inet6/{print $2}' | cut -d/ -f1 | head -1)
              echo "Checking IPv6 reachability via $ipv6_addr..."
              local status6
              status6=$(curl -6 -s -o /dev/null -w "%{http_code}" --max-time 10 \
                --resolve "craft-dashboard.name:443:[$ipv6_addr]" \
                https://craft-dashboard.name/ 2>/dev/null || true)
              echo "  IPv6 status: $status6"
              [ "$status6" = "200" ] || { echo "ERROR: craft-dashboard did not come up on IPv6 (status: $status6)"; exit 1; }
              echo "craft-dashboard is up on IPv6."
            }

            verify_remark42() {
              echo "Verifying comments.pcbisolation.com..."
              local status
              status=$(curl -4 -s -o /dev/null -w "%{http_code}" --max-time 10 \
                --resolve comments.pcbisolation.com:80:127.0.0.1 \
                http://comments.pcbisolation.com/api/v1/ping 2>/dev/null || true)
              echo "comments.pcbisolation.com status: $status"
              [[ "$status" = "200" || "$status" = "301" || "$status" = "308" ]] || \
                { echo "ERROR: Remark42 did not come up (status: $status)"; exit 1; }
              echo "comments.pcbisolation.com is up."
            }

            apply_firewall_rules() {
              # Ensure vps-net subnets have forward rules in NETAVARK_FORWARD
              local subnet ipv6_subnet
              subnet=$(podman network inspect vps-net --format '{{range .Subnets}}{{.Subnet}} {{end}}' | tr ' ' '\n' | grep -v ':' | head -1)
              ipv6_subnet=$(podman network inspect vps-net --format '{{range .Subnets}}{{.Subnet}} {{end}}' | tr ' ' '\n' | grep ':' | head -1)
              nft insert rule ip filter NETAVARK_FORWARD ip daddr "$subnet" ct state new accept 2>/dev/null || true
              nft insert rule ip6 filter NETAVARK_FORWARD ip6 daddr "$ipv6_subnet" ct state new accept 2>/dev/null || true

              # Fix Netavark's broken IPv6 DNAT rules pointing to Caddy
              if podman ps --filter name=vps-infra_caddy_1 --filter status=running --format '{{.Names}}' | grep -q vps-infra_caddy_1; then
                local caddy_ipv6 public_ipv6
                caddy_ipv6=$(podman inspect vps-infra_caddy_1 --format '{{range .NetworkSettings.Networks}}{{.GlobalIPv6Address}}{{end}}')
                public_ipv6=$(ip -6 addr show eth0 | awk '/inet6.*global/{print $2}' | cut -d/ -f1 | head -1)
                for CHAIN in PREROUTING OUTPUT; do
                  while true; do
                    local line
                    line=$(ip6tables -t nat -L "$CHAIN" --line-numbers -n | awk '/vps-infra-ipv6-dnat/{print $1; exit}')
                    [ -z "$line" ] && break
                    ip6tables -t nat -D "$CHAIN" "$line"
                  done
                done
                for PORT in 80 443; do
                  ip6tables -t nat -I PREROUTING 1 -p tcp --dport "$PORT" \
                    -m comment --comment "vps-infra-ipv6-dnat" \
                    -j DNAT --to-destination ["$caddy_ipv6"]:"$PORT"
                  ip6tables -t nat -I OUTPUT 1 -p tcp -d "$public_ipv6" --dport "$PORT" \
                    -m comment --comment "vps-infra-ipv6-dnat" \
                    -j DNAT --to-destination ["$caddy_ipv6"]:"$PORT"
                done
              fi
            }

            # Handle repository_dispatch events (zero-downtime / isolated updates)
            if [ "$EVENT_NAME" = "repository_dispatch" ]; then
              case "$EVENT_TYPE" in
                egg-calculator-updated)
                  update_submodule static-sites/egg-calculator
                  verify_egg_calculator
                  exit 0
                  ;;
                pcbisolation-updated)
                  update_submodule static-sites/pcbisolation
                  verify_pcbisolation
                  exit 0
                  ;;
                flashcandy-updated)
                  update_submodule static-sites/flashcandy
                  verify_flashcandy
                  exit 0
                  ;;
                bm-tracker-updated)
                  git checkout -- . 2>/dev/null || true
                  git pull --no-recurse-submodules origin main 2>/dev/null || true
                  podman pull ghcr.io/mr-cal/bm-tracker:latest
                  podman-compose -p vps-infra -f docker-compose.bm-tracker.yml up -d --force-recreate
                  podman ps --filter name=vps-infra_bm-tracker_1 --filter status=running --format '{{.Names}}' | grep -q vps-infra_bm-tracker_1
                  apply_firewall_rules
                  verify_bm_tracker
                  exit 0
                  ;;
                craft-dashboard-updated)
                  git checkout -- . 2>/dev/null || true
                  git pull --no-recurse-submodules origin main 2>/dev/null || true
                  podman pull ghcr.io/mr-cal/craft-dashboard:latest
                  podman-compose -p vps-infra -f docker-compose.craft-dashboard.yml up -d --force-recreate
                  podman-compose -p vps-infra -f docker-compose.llm-evaluate.yml up -d --force-recreate
                  podman ps --filter name=vps-infra_craft-dashboard_1 --filter status=running --format '{{.Names}}' | grep -q vps-infra_craft-dashboard_1
                  podman ps --filter name=vps-infra_llm-evaluate_1 --filter status=running --format '{{.Names}}' | grep -q vps-infra_llm-evaluate_1
                  apply_firewall_rules
                  verify_craft_dashboard
                  exit 0
                  ;;
                *)
                  echo "Unknown repository_dispatch event: $EVENT_TYPE. Falling back to full check."
                  ;;
              esac
            fi

            # For push to main or workflow_dispatch:
            # Capture the commit range to detect changed paths
            BEFORE_SHA="${{ github.event.before || '' }}"
            AFTER_SHA="${{ github.sha }}"
            DIFF_FILES=""
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              DIFF_FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null || true)
            fi

            # Clean stale rebase dirs first, then pull without recurse, then update explicitly.
            find .git/modules -name 'rebase-merge' -type d -exec rm -rf {} + 2>/dev/null || true
            find .git/modules -name 'rebase-apply' -type d -exec rm -rf {} + 2>/dev/null || true
            git checkout -- . 2>/dev/null || true
            git pull --no-recurse-submodules origin main
            git submodule update --checkout --remote --init --recursive

            # .env is a one-time manual setup step, not something the deploy creates
            if [ ! -f /opt/vps-infra/.env ]; then
              echo "ERROR: /opt/vps-infra/.env is missing. Copy .env.example, fill in required secrets, and chmod 600 it."
              exit 1
            fi

            # Install/update the startup service so the site survives reboots.
            install -m 0755 systemd/vps-infra-startup.sh /usr/local/sbin/vps-infra-startup.sh
            install -m 0644 systemd/vps-infra-startup.service /etc/systemd/system/vps-infra-startup.service
            systemctl daemon-reload
            systemctl enable vps-infra-startup.service

            # The bm-tracker database lives here.
            install -d -m 0750 /opt/vps-infra/data/bm-tracker
            install -d -m 0750 /opt/vps-infra/backups

            if [ ! -f /opt/vps-infra/.env.bm-tracker ]; then
              echo "ERROR: /opt/vps-infra/.env.bm-tracker is missing. Copy .env.bm-tracker.example, set SESSION_SECRET to 32+ random bytes, and chmod 600 it."
              exit 1
            fi

            # Install/update cron jobs for craft-dashboard.
            install -m 0644 cron.d/collect-data /etc/cron.d/collect-data
            install -m 0644 cron.d/backfill-snapshots /etc/cron.d/backfill-snapshots
            install -m 0644 cron.d/commit-scanner /etc/cron.d/commit-scanner
            install -m 0644 cron.d/backup-craft-dashboard /etc/cron.d/backup-craft-dashboard
            chmod 0755 backups/backup.sh

            install -m 0644 logrotate.d/collect-data /etc/logrotate.d/collect-data
            install -m 0644 logrotate.d/commit-scanner /etc/logrotate.d/commit-scanner

            install -m 0644 cron.d/prune-images /etc/cron.d/prune-images
            install -m 0644 cron.d/disk-space-check /etc/cron.d/disk-space-check
            install -m 0644 cron.d/backup-remark42 /etc/cron.d/backup-remark42
            install -m 0644 cron.d/backup-bm-tracker /etc/cron.d/backup-bm-tracker
            chmod 0755 backups/check_disk_space.sh backups/backup_remark42.sh

            mkdir -p /etc/systemd/journald.conf.d
            install -m 0644 systemd/journald-vps-infra.conf /etc/systemd/journald.conf.d/vps-infra.conf
            systemctl restart systemd-journald

            install -d -m 0700 /etc/vps-infra
            cat > /etc/vps-infra/secrets.env <<EOF
            RESEND_API_KEY=${RESEND_API_KEY}
            REMARK_ADMIN_EMAIL=${REMARK_ADMIN_EMAIL}
            REMARK_ADMIN_PASSWD=${REMARK_ADMIN_PASSWD}
            REMARK_BACKUP_GPG_PASSPHRASE=${REMARK_BACKUP_GPG_PASSPHRASE}
            ALERT_EMAIL_TO=${REMARK_ADMIN_EMAIL}
            ALERT_EMAIL_FROM=noreply@pcbisolation.com
            EOF
            chmod 0600 /etc/vps-infra/secrets.env

            sed -i '/# vps-infra: prefer IPv4 (see AGENTS.md Known Quirks)/,+1d' /etc/gai.conf 2>/dev/null || true

            # Ensure persistent network exists
            podman network exists vps-net || podman network create --ipv6 vps-net

            # Create or update the DB password podman secret.
            podman secret rm db_password 2>/dev/null || true
            printf '%s' "$DB_PASSWORD" | podman secret create db_password -

            # Check if only static-sites changed in this push
            ONLY_STATIC=false
            if [ -n "$DIFF_FILES" ]; then
              NON_STATIC=$(echo "$DIFF_FILES" | grep -v '^static-sites/' || true)
              if [ -z "$NON_STATIC" ]; then
                ONLY_STATIC=true
              fi
            fi

            if [ "$ONLY_STATIC" = "true" ]; then
              echo "Only static site submodules changed; skipping container recreation."
            else
              # Pull images explicitly
              podman pull docker.io/library/caddy:2-alpine
              podman pull docker.io/pgvector/pgvector:pg16
              podman pull ghcr.io/mr-cal/craft-dashboard:latest
              podman pull ghcr.io/mr-cal/bm-tracker:latest

              # Render Remark42 compose
              sed \
                -e "s/REPLACE_WITH_OPENSSL_OUTPUT/$REMARK_SECRET/" \
                -e "s/REPLACE_WITH_RESEND_API_KEY/$RESEND_API_KEY/" \
                -e "s/REPLACE_WITH_AKISMET_KEY/$AKISMET_KEY/" \
                -e "s/REPLACE_WITH_ADMIN_PASSWORD/$REMARK_ADMIN_PASSWD/" \
                -e "s/REPLACE_WITH_ADMIN_EMAIL/$REMARK_ADMIN_EMAIL/" \
                docker-compose.remark42.yml > /tmp/docker-compose.remark42.rendered.yml

              # Check if Caddy container is already running
              CADDY_WAS_RUNNING=false
              if podman ps --filter name=vps-infra_caddy_1 --filter status=running --format '{{.Names}}' | grep -q vps-infra_caddy_1; then
                CADDY_WAS_RUNNING=true
              fi

              # Start / update services
              podman-compose -p vps-infra -f docker-compose.caddy.yml up -d
              podman-compose -p vps-infra -f docker-compose.bm-tracker.yml up -d
              podman-compose -p vps-infra -f docker-compose.craft-dashboard.yml up -d
              podman-compose -p vps-infra -f docker-compose.llm-evaluate.yml up -d
              podman-compose -p vps-infra -f /tmp/docker-compose.remark42.rendered.yml up -d

              # If Caddy was already running, reload configuration cleanly with 0 downtime
              if [ "$CADDY_WAS_RUNNING" = "true" ]; then
                echo "Reloading Caddy configuration with 0 downtime..."
                podman exec vps-infra_caddy_1 caddy reload --config /etc/caddy/Caddyfile || true
              fi
            fi

            # Verify containers are running
            podman ps --filter name=vps-infra_caddy_1 --filter status=running --format '{{.Names}}' | grep -q vps-infra_caddy_1
            podman ps --filter name=vps-infra_postgres_1 --filter status=running --format '{{.Names}}' | grep -q vps-infra_postgres_1
            podman ps --filter name=vps-infra_craft-dashboard_1 --filter status=running --format '{{.Names}}' | grep -q vps-infra_craft-dashboard_1
            podman ps --filter name=vps-infra_remark42_1 --filter status=running --format '{{.Names}}' | grep -q vps-infra_remark42_1
            podman ps --filter name=vps-infra_llm-evaluate_1 --filter status=running --format '{{.Names}}' | grep -q vps-infra_llm-evaluate_1
            podman ps --filter name=vps-infra_bm-tracker_1 --filter status=running --format '{{.Names}}' | grep -q vps-infra_bm-tracker_1

            # Apply firewall / DNAT rules
            apply_firewall_rules

            # Run full verification suite
            verify_craft_dashboard
            verify_bm_tracker
            verify_egg_calculator
            verify_pcbisolation
            verify_remark42
            verify_flashcandy
