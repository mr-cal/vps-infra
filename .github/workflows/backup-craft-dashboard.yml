name: Backup craft-dashboard database

# Pulls the latest encrypted craft-dashboard PostgreSQL backup off the VPS
# and stores it as a build artifact. The file is already gpg-encrypted by
# backups/backup.sh before it ever leaves the VPS — this workflow never
# sees or needs the decryption passphrase.
on:
  schedule:
    # Daily 03:45 UTC — after the daily 03:00 UTC backup cron on the VPS.
    - cron: "45 3 * * *"
  workflow_dispatch:

jobs:
  fetch-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest encrypted backup from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh craft-dashboard-backup
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          LATEST="$(ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            'ls -t /opt/vps-infra/backups/craft_dashboard_*.sql.gz.gpg 2>/dev/null | head -1')"

          if [ -z "${LATEST}" ]; then
            echo "No craft-dashboard backup file found on VPS (has backup.sh run yet?)" >&2
            exit 1
          fi

          echo "Fetching ${LATEST}"
          scp -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}:${LATEST}" craft-dashboard-backup/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: craft-dashboard-db-backup-${{ github.run_id }}
          path: craft-dashboard-backup/*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
