# Continuous LLM evaluation worker for craft-dashboard.
#
# Runs `scripts/run_llm.py evaluate` against craft-dashboard's `/api/eval/*`
# HTTP API only (see craft-dashboard's docs/evaluate.md) — it never touches
# the database directly. `llm-evaluate.env` deliberately has NO
# DATABASE_URL, so even if this container were compromised it has no way to
# reach the database, only the HTTP API craft-dashboard already exposes.
#
# The /opt/vps-infra/mirrors bind mount (read-only here, read-write in
# docker-compose.craft-dashboard.yml) is additive only: it gives this
# container read access to the bare git mirrors craft-dashboard maintains
# for deep evaluation's git tools (craft-dashboard's Phase 2 git_mirrors
# package). It does not change the container's database-isolation guarantee
# above — public, already-cloned source code, read-only.

services:
  llm-evaluate:
    image: ghcr.io/mr-cal/craft-dashboard:latest
    # --concurrency 6: Phase 6's tool-calling loop runs git subprocesses
    # (via craft-dashboard's git_mirrors reader) per concurrent evaluation,
    # so eval concurrency is pinned below the CLI's built-in default of 10
    # to bound RAM/CPU on this VPS's shared resources.
    command: ["/app/.venv/bin/python", "/app/scripts/run_llm.py", "evaluate", "--all-issues", "--concurrency", "6"]
    env_file: llm-evaluate.env
    volumes:
      - /opt/vps-infra/mirrors:/opt/vps-infra/mirrors:ro
    environment:
      CRAFT_DASHBOARD_MIRROR_DIR: /opt/vps-infra/mirrors
      # Bound simultaneous git subprocesses (git grep/log/show) independent
      # of eval concurrency. 2 is the recommended VPS value (see
      # craft-dashboard's Phase 2 plan); set explicitly so a future code
      # default change can't silently raise it on this 1-vCPU VPS.
      CRAFT_DASHBOARD_GIT_CONCURRENCY: 2
    networks:
      - vps-net
    restart: unless-stopped

networks:
  vps-net:
    external: true
